name: Claude

# @claude-Mention-Responder (Review-Fallback-Stufe "claude")
# ----------------------------------------------------------
# Reagiert auf @claude-Mentions in PR-/Issue-Kommentaren, Review-Kommentaren
# und Issues. Das ist die Voraussetzung der Review-Fallback-Kette
# (flos-claude-skills/references/review-fallbacks.yaml, Stufe "claude"):
# Ohne diese Datei auf dem DEFAULT-Branch ist die Claude-App auf Mentions
# taub — issue_comment-Events laden den Workflow immer von main, die Datei
# wirkt also erst NACH dem Merge.
#
# Die claude-code-action prüft selbst, ob der mentionende Account
# Schreibrechte im Repo hat — fremde Mentions starten keinen Lauf.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write (nicht read): sonst läuft der Job grün durch, kann aber keine
      # Review-/Inline-Kommentare auf den PR schreiben (stiller No-op).
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude darf CI-Ergebnisse des PR lesen.

    steps:
      # Actions auf Commit-SHA gepinnt (Supply-Chain-Härtung).
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          # persist-credentials MUSS true bleiben (Default). Die Annahme, die
          # Action bringe ihre eigene Auth mit, gilt für issue_comment-Events
          # NICHT: Dort checkt der Workflow den Default-Branch aus, und die
          # Action holt den PR-Head selbst per `git fetch origin --depth=20
          # <branch>` nach. Ohne Credentials in .git/config scheitert das in
          # einem PRIVATEN Repo, und der Lauf endet mit
          #   Action failed with error: Command failed:
          #   git fetch origin --depth=20 <branch>
          # Gemessen an flos-claude-skills#157 (28.08.2026): Der einzige bis
          # dahin grüne Lauf war ein pull_request_review-Event, bei dem der
          # Head schon ausgecheckt ist und kein Fetch nötig wird — der
          # Mention-Pfad der Fallback-Kette war also nie erprobt.
          #
          # Nachtrag zum Action-Bump in #232: Der Auth-Pfad dahinter hat sich
          # geändert. Seit actions/checkout v4.3.1 (Backport aus v6.0.0) steht
          # der Auth-Header nicht mehr in .git/config, sondern in einer Datei
          # unter RUNNER_TEMP, eingebunden per include.path. Das
          # `git config --unset-all ...extraheader` der Action lief dadurch ins
          # Leere, die Checkout-Credential blieb liegen, und der Fetch nutzte
          # sie. claude-code-action#1526 entfernt sie jetzt wirklich und ersetzt
          # sie durch die eigene Credential der Action.
          #
          # Das ändert aber NICHTS an der Notwendigkeit dieser Zeile, im
          # Gegenteil, der Quelltext am gepinnten Stand belegt sie (#238).
          # Entscheidend ist die Reihenfolge im Tag-Mode, also im Mention-Pfad:
          #   src/modes/tag/index.ts:67     setupBranch(...)
          #   src/modes/tag/index.ts:84/97  configureGitAuth(...)
          # setupBranch läuft VOR configureGitAuth, und setupBranch ist der
          # Fetch aus dem Absatz oben:
          #   src/github/operations/branch.ts:185  Math.max(commitCount, 20)
          #   src/github/operations/branch.ts:214  execGit(["fetch","origin",...])
          # Davor steht nur fetchGitHubData (Zeile 53), das per Octokit gegen
          # die API geht, nicht per git. Zum Fetch-Zeitpunkt hat git also nur
          # die von actions/checkout persistierte Credential; die eigene der
          # Action (Credential-Helper bzw. Token in remote.origin.url, siehe
          # src/github/operations/git-config.ts) kommt erst danach.
          # Mit persist-credentials: false hätte git hier im privaten Repo gar
          # keine Credential, und der Lauf scheiterte wie in #157.
          # Beim nächsten Action-Bump prüfen, ob diese Reihenfolge noch gilt.
          persist-credentials: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1 (Claude Code 2.1.261)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Workflow-Permissions allein reichen nicht: Auch der App-Token der
          # Action braucht actions: read, damit Claude CI-Ergebnisse lesen kann.
          additional_permissions: |
            actions: read
